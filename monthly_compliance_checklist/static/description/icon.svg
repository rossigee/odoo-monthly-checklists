<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#875A7B" opacity="0.1"/>
  
  <!-- Calendar grid -->
  <rect x="20" y="25" width="60" height="50" fill="none" stroke="#875A7B" stroke-width="2" rx="3"/>
  
  <!-- Calendar header -->
  <rect x="20" y="25" width="60" height="10" fill="#875A7B" rx="3"/>
  
  <!-- Calendar grid lines -->
  <line x1="20" y1="45" x2="80" y2="45" stroke="#875A7B" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="55" x2="80" y2="55" stroke="#875A7B" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="65" x2="80" y2="65" stroke="#875A7B" stroke-width="1" opacity="0.5"/>
  
  <line x1="35" y1="35" x2="35" y2="75" stroke="#875A7B" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="35" x2="50" y2="75" stroke="#875A7B" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="35" x2="65" y2="75" stroke="#875A7B" stroke-width="1" opacity="0.5"/>
  
  <!-- Checkmarks -->
  <path d="M25 50 L28 53 L33 48" fill="none" stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 50 L43 53 L48 48" fill="none" stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M55 60 L58 63 L63 58" fill="none" stroke="#28a745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Progress indicator -->
  <circle cx="70" cy="70" r="3" fill="#ffc107"/>
</svg>